<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/e-pharmacy-ci/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="E-Pharmacy CI – commandez vos médicaments en ligne, trouvez une pharmacie ouverte près de vous et échangez avec votre pharmacien en Côte d&#39;Ivoire.">
  <meta name="theme-color" content="#00B4D8">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="E-Pharmacy CI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>E-Pharmacy CI – Pharmacie en ligne</title>
  <style>
    html, body { margin: 0; height: 100%; background: #00B4D8; }
    #app-splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: #00B4D8;
      color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease; z-index: 9999; }
    #app-splash .logo { width: 88px; height: 88px; border-radius: 24px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.12); font-size: 44px; color: #00B4D8; font-weight: 800; }
    #app-splash .name { font-size: 24px; font-weight: 700; letter-spacing: .3px; }
    #app-splash .spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.35);
      border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #app-splash.hidden { opacity: 0; pointer-events: none; }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-splash" role="status" aria-label="Chargement de E-Pharmacy CI">
    <div class="logo">+</div>
    <div class="name">E-Pharmacy CI</div>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('app-splash');
      if (!s) return;
      s.classList.add('hidden');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js?v=2" async></script>
</body>
</html>
